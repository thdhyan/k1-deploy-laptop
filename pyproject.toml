[project]
name = "k1-deploy-laptop"
version = "0.1.0"
description = "ROS 2 jazzy workspace, push-IK web/sim, pad sender, sim-to-sim."
requires-python = ">=3.10"
dependencies = [
  "evdev",
  "imageio",
  "mujoco",
  "numpy",
  "opencv-python",
  "pytest",
  "torch",
  "k1-common",
  "k1-description",
  "k1-runtime",
  "k1-teleop",
  "k1-perception",
]

[tool.uv.sources]
k1-common = { git = "https://github.com/thdhyan/k1-common" }
k1-description = { git = "https://github.com/thdhyan/k1-description" }
k1-runtime = { git = "https://github.com/thdhyan/k1-runtime" }
k1-teleop = { git = "https://github.com/thdhyan/k1-teleop" }
k1-perception = { git = "https://github.com/thdhyan/k1-perception" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Python module roots inside the ROS packages (src/<pkg>/<pkg>); colcon builds the rest.
packages = ["src/k1_control/k1_control", "src/k1_fleet_rviz/k1_fleet_rviz", "src/k1_locomotion/k1_locomotion", "src/k1_wbc/k1_wbc"]

# Provided by the environment (ROS 2, Isaac Sim/Lab, mjlab, robot SDK) or not on PyPI under this name:
# ament_index_python, geometry_msgs, launch, launch_ros, nav_msgs, push_ik_phasespace, push_ik_sim, rclpy, sensor_msgs, setuptools, std_msgs, tf2_msgs
